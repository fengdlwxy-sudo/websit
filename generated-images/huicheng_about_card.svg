<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007A8A"/>
      <stop offset="100%" stop-color="#00A8B5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="rgba(0,80,90,0.25)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="1200" fill="url(#bg)"/>

  <!-- 装饰圆环 -->
  <circle cx="850" cy="180" r="280" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="850" cy="180" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="150" cy="1050" r="240" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>

  <!-- 装饰点阵 -->
  <g fill="rgba(255,255,255,0.18)">
    <circle cx="90" cy="220" r="6"/>
    <circle cx="130" cy="220" r="4"/>
    <circle cx="90" cy="260" r="4"/>
    <circle cx="130" cy="260" r="6"/>
    <circle cx="90" cy="300" r="6"/>
    <circle cx="130" cy="300" r="4"/>
  </g>
  <g fill="rgba(255,255,255,0.18)">
    <circle cx="870" cy="900" r="6"/>
    <circle cx="910" cy="900" r="4"/>
    <circle cx="870" cy="940" r="4"/>
    <circle cx="910" cy="940" r="6"/>
    <circle cx="870" cy="980" r="6"/>
    <circle cx="910" cy="980" r="4"/>
  </g>

  <!-- 主视觉卡片 -->
  <rect x="120" y="180" width="760" height="840" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- 顶部图标装饰：公司 logo -->
  <image href="data:image/png;base64," x="370" y="270" width="260" height="60" preserveAspectRatio="xMidYMid meet"/>

  <!-- 大标题：汇程移民 -->
  <text x="500" y="560" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="120" font-weight="800" fill="#FFFFFF" letter-spacing="8">汇程移民</text>

  <!-- 分割线 -->
  <line x1="320" y1="620" x2="680" y2="620" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>

  <!-- 副标题 -->
  <text x="500" y="720" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="42" font-weight="500" fill="#FFFFFF" opacity="0.95">专业移民经验护航</text>
  <text x="500" y="790" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="42" font-weight="500" fill="#FFFFFF" opacity="0.95">助您身份规划更轻松</text>

  <!-- 小标题 -->
  <text x="500" y="900" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="34" font-weight="400" fill="rgba(255,255,255,0.85)">一对一定制，契合您的专属移民方案</text>

  <!-- 底部装饰点 -->
  <circle cx="500" cy="1020" r="8" fill="rgba(255,255,255,0.7)"/>
</svg>