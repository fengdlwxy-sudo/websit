    <rect x="497" y="1425" width="48" height="48"/>
    <rect x="395" y="1527" width="48" height="48"/>
    <rect x="412" y="1442" width="14" height="14" fill="#ffffff"/>
    <rect x="514" y="1442" width="14" height="14" fill="#ffffff"/>
    <rect x="412" y="1544" width="14" height="14" fill="#ffffff"/>
    <rect x="455" y="1465" width="12" height="12"/>
    <rect x="480" y="1485" width="12" height="12"/>
    <rect x="510" y="1465" width="12" height="12"/>
    <rect x="455" y="1495" width="12" height="12"/>
    <rect x="510" y="1495" width="12" height="12"/>
    <rect x="455" y="1527" width="12" height="12"/>
