  <circle cx="540" cy="1105" r="22" fill="#007A8A" opacity="0.1"/>
  <circle cx="540" cy="1102" r="10" fill="none" stroke="#007A8A" stroke-width="2"/>
  <path d="M 540 1092 L 540 1098 M 540 1106 L 540 1112" stroke="#007A8A" stroke-width="2"/>
