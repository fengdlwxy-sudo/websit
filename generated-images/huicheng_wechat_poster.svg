    <line x1="-98" y1="0" x2="-22" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="-60" y1="-38" x2="-60" y2="38" stroke="#ffffff" stroke-width="2"/>
    <!-- 护照 -->
