# 部署到 VM 后，复制到 /etc/nginx/sites-available/m.huichengyimin.com
# 用法见 chat 中的部署步骤。certbot 会自动把本文件改成 HTTPS 并重写 80→443。

server {
    listen 80;
    server_name m.huichengyimin.com;

    # Let's Encrypt 验证目录（certbot 需要）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 静态资源可加缓存；HTML 由服务端控制不缓存（server.js 已设 no-cache）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其余请求（含 /api/*、HTML 页面）反代到 Node
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
